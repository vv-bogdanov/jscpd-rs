name: socket-score

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * *"

permissions:
  contents: read

jobs:
  socket-score:
    name: Socket npm package score
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Socket package score
        env:
          SOCKET_REQUIRE_PUBLISHED: "1"
          SOCKET_RETRIES: "3"
          SOCKET_RETRY_DELAY_MS: "30000"
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
        run: node scripts/socket-package-check.mjs
