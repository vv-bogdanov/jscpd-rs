name: crates-publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      package_name:
        description: "Type jscpd-rs to confirm crates.io publication"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish crates.io package
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirm package
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ inputs.package_name }}" != "jscpd-rs" ]]; then
            echo "package_name must be exactly jscpd-rs" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup component add rustfmt --toolchain 1.93.0
          rustup default 1.93.0

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-crates-publish-cargo-1.93.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-crates-publish-cargo-1.93.0-
            ${{ runner.os }}-cargo-1.93.0-

      - name: Check release tag matches crate version
        if: github.event_name == 'release'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${{ github.event.release.tag_name }}"
          if [[ "$tag" != "v${version}" ]]; then
            echo "release tag ${tag} does not match crate version ${version}" >&2
            exit 1
          fi

      - name: Check crate version is not published
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if (cd "$tmp" && cargo info "jscpd-rs@${version}" >/dev/null 2>&1); then
            echo "jscpd-rs@${version} is already published on crates.io" >&2
            exit 1
          fi

      - name: Verify crate package
        run: |
          cargo fmt --check
          cargo test
          cargo publish --dry-run --locked

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
