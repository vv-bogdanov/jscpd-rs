name: crates-publish

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ""
        type: string
      run_release_candidate:
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      package_name:
        description: "Type jscpd-rs to confirm crates.io publication"
        required: true
        type: string
      release_tag:
        description: "Optional release tag/ref to publish"
        required: false
        default: ""
        type: string
      run_release_candidate:
        description: "Run the full release-candidate gate before publishing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-candidate:
    if: ${{ inputs.run_release_candidate }}
    uses: ./.github/workflows/release-gate.yml
    with:
      release_candidate: true
      full: true
      public: true
      public_runs: "3"

  publish:
    name: publish crates.io package
    needs: release-candidate
    if: ${{ always() && (!inputs.run_release_candidate || needs.release-candidate.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirm package
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ inputs.package_name }}" != "jscpd-rs" ]]; then
            echo "package_name must be exactly jscpd-rs" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup component add rustfmt --toolchain 1.93.0
          rustup default 1.93.0

      - name: Cache Cargo registry and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-crates-publish-cargo-1.93.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-crates-publish-cargo-1.93.0-
            ${{ runner.os }}-cargo-1.93.0-

      - name: Check release tag matches crate version
        if: inputs.release_tag != ''
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${{ inputs.release_tag }}"
          if [[ "$tag" != "v${version}" ]]; then
            echo "release tag ${tag} does not match crate version ${version}" >&2
            exit 1
          fi

      - name: Check crate version is not published
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if (cd "$tmp" && cargo info "jscpd-rs@${version}" >/dev/null 2>&1); then
            echo "jscpd-rs@${version} is already published on crates.io" >&2
            exit 1
          fi

      - name: Verify crate package
        run: |
          cargo fmt --check
          cargo test
          cargo publish --dry-run --locked

      - name: Detect registry token secret
        id: registry-token
        run: |
          if [[ -n "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Authenticate to crates.io with Trusted Publishing
        if: steps.registry-token.outputs.available != 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish with Trusted Publishing
        if: steps.registry-token.outputs.available != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Publish with registry token
        if: steps.registry-token.outputs.available == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
