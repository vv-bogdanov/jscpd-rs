name: npm-publish

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ""
        type: string
      run_release_candidate:
        required: false
        default: true
        type: boolean
      target:
        required: false
        default: ""
        type: string
      publish_main:
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      package_name:
        description: "Type jscpd-rs to confirm npm publication"
        required: true
        type: string
      release_tag:
        description: "Optional release tag/ref to publish"
        required: false
        default: ""
        type: string
      target:
        description: "Optional prebuilt target key to publish only one platform package"
        required: false
        default: ""
        type: string
      publish_main:
        description: "Publish the main jscpd-rs npm package after platform packages"
        required: false
        default: true
        type: boolean
      run_release_candidate:
        description: "Run the full release-candidate gate before publishing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  release-candidate:
    if: ${{ inputs.run_release_candidate }}
    uses: ./.github/workflows/release-gate.yml
    with:
      release_candidate: true
      full: true
      public: true
      public_runs: "3"

  prepare:
    name: prepare npm release
    needs: release-candidate
    if: ${{ always() && (!inputs.run_release_candidate || needs.release-candidate.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      publish_main: ${{ steps.metadata.outputs.publish_main }}
      targets: ${{ steps.metadata.outputs.targets }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Confirm package
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ inputs.package_name }}" != "jscpd-rs" ]]; then
            echo "package_name must be exactly jscpd-rs" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Read npm metadata
        id: metadata
        run: |
          if [[ -n "$TARGET_FILTER" && "$PUBLISH_MAIN" == "true" ]]; then
            echo "target filter can only be used with publish_main=false" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          targets="$(
            node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const targetFilter = process.env.TARGET_FILTER;
          const targets = JSON.parse(fs.readFileSync('npm/prebuilt-targets.json', 'utf8'));
          const entries = Object.entries(targets);
          const selected = targetFilter
            ? entries.filter(([key]) => key === targetFilter)
            : entries;
          if (targetFilter && selected.length === 0) {
            console.error(`unknown prebuilt target: ${targetFilter}`);
            console.error(`available targets: ${entries.map(([key]) => key).join(', ')}`);
            process.exit(1);
          }
          console.log(
            JSON.stringify(
              selected.map(([key, target]) => ({ key, ...target })),
            ),
          );
          NODE
          )"
          {
            echo "version=${version}"
            echo "targets=${targets}"
            echo "publish_main=${PUBLISH_MAIN}"
          } >> "$GITHUB_OUTPUT"
        env:
          PUBLISH_MAIN: ${{ inputs.release_tag != '' || inputs.publish_main }}
          TARGET_FILTER: ${{ inputs.target || '' }}

      - name: Check release tag matches package version
        if: inputs.release_tag != ''
        run: |
          version="${{ steps.metadata.outputs.version }}"
          tag="${{ inputs.release_tag }}"
          if [[ "$tag" != "v${version}" ]]; then
            echo "release tag ${tag} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Check main package version is not published
        if: steps.metadata.outputs.publish_main == 'true'
        run: |
          version="${{ steps.metadata.outputs.version }}"
          if npm view "jscpd-rs@${version}" version >/dev/null 2>&1; then
            echo "jscpd-rs@${version} is already published" >&2
            exit 1
          fi

  build-platform-packages:
    name: build ${{ matrix.target.key }}
    needs: prepare
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check platform package version
        id: platform-package
        run: |
          version="${{ needs.prepare.outputs.version }}"
          package_name="${{ matrix.target.packageName }}"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} is already published; skipping build"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.platform-package.outputs.published != 'true'
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          rustup target add "${{ matrix.target.rustTarget }}"

      - name: Cache Cargo registry and target
        if: steps.platform-package.outputs.published != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target.key }}-cargo-1.93.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target.key }}-cargo-1.93.0-
            ${{ runner.os }}-cargo-1.93.0-

      - name: Build native binaries
        if: steps.platform-package.outputs.published != 'true'
        run: |
          cargo build \
            --release \
            --locked \
            --target "${{ matrix.target.rustTarget }}" \
            --bin jscpd \
            --bin jscpd-server

      - name: Create platform package
        if: steps.platform-package.outputs.published != 'true'
        id: package
        run: |
          package_dir="$(
            node scripts/npm-prebuilt-package.mjs \
              --target "${{ matrix.target.key }}" \
              --bin-dir "target/${{ matrix.target.rustTarget }}/release" \
              --out-dir "target/npm-prebuilt"
          )"
          echo "package_dir=${package_dir}" >> "$GITHUB_OUTPUT"

      - name: Smoke platform package
        if: steps.platform-package.outputs.published != 'true'
        run: |
          package_dir="${{ steps.package.outputs.package_dir }}"
          test "$("$package_dir/bin/${{ matrix.target.os == 'win32' && 'jscpd.exe' || 'jscpd' }}" --version)" = "${{ needs.prepare.outputs.version }}"
          test "$("$package_dir/bin/${{ matrix.target.os == 'win32' && 'jscpd-server.exe' || 'jscpd-server' }}" --version)" = "${{ needs.prepare.outputs.version }}"
          npm pack "$package_dir" --pack-destination "$RUNNER_TEMP" --json >/dev/null

      - name: Publish platform package
        if: steps.platform-package.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          package_name="${{ matrix.target.packageName }}"
          package_dir="${{ steps.package.outputs.package_dir }}"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} is already published; skipping"
            exit 0
          fi
          npm publish "$package_dir" --access public --provenance

  publish-main:
    name: publish main npm package
    needs:
      - prepare
      - build-platform-packages
    if: ${{ needs.prepare.result == 'success' && needs.build-platform-packages.result == 'success' && needs.prepare.outputs.publish_main == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-npm-main-cargo-1.93.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-npm-main-cargo-1.93.0-
            ${{ runner.os }}-cargo-1.93.0-

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Report platform package availability
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const version = process.env.VERSION;
          const targets = JSON.parse(fs.readFileSync('npm/prebuilt-targets.json', 'utf8'));
          let missing = 0;
          for (const [key, target] of Object.entries(targets)) {
            const spec = `${target.packageName}@${version}`;
            const result = spawnSync('npm', ['view', spec, 'version'], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
            });
            if (result.status === 0) {
              console.log(`${key}: ${spec} is published`);
            } else {
              missing += 1;
              console.log(`::error title=Missing prebuilt package::${spec} is not published; refusing to publish the main package without the configured platform package set`);
            }
          }
          if (missing > 0) {
            process.exit(1);
          }
          NODE
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Verify npm package
        run: scripts/npm-package-check.sh

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Verify npm registry provenance
        env:
          NPM_REGISTRY_REQUIRE_PUBLISHED: "1"
          NPM_REGISTRY_RETRIES: "6"
          NPM_REGISTRY_RETRY_DELAY_MS: "30000"
        run: scripts/npm-registry-check.sh

      - name: Verify Socket package score
        env:
          SOCKET_REQUIRE_PUBLISHED: "1"
          SOCKET_RETRIES: "6"
          SOCKET_RETRY_DELAY_MS: "30000"
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
        run: node scripts/socket-package-check.mjs
