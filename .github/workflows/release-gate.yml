name: release-gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      full:
        required: false
        default: true
        type: boolean
      public:
        required: false
        default: true
        type: boolean
      release_candidate:
        required: false
        default: true
        type: boolean
      public_runs:
        required: false
        default: "3"
        type: string
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full compatibility matrix"
        required: false
        default: false
        type: boolean
      public:
        description: "Run the public benchmark suite"
        required: false
        default: false
        type: boolean
      release_candidate:
        description: "Run release-candidate gate"
        required: false
        default: false
        type: boolean
      public_runs:
        description: "Number of public benchmark timing runs"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      FULL: ${{ inputs.full && '1' || '0' }}
      PUBLIC: ${{ inputs.public && '1' || '0' }}
      RELEASE_CANDIDATE: ${{ inputs.release_candidate && '1' || '0' }}
      PUBLIC_RUNS: ${{ inputs.public_runs || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup component add rustfmt --toolchain 1.93.0
          if [[ "$RELEASE_CANDIDATE" == "1" ]]; then
            rustup component add clippy --toolchain 1.93.0
          fi
          rustup default 1.93.0

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.93.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.93.0-

      - name: Install cargo-llvm-cov
        if: env.RELEASE_CANDIDATE == '1'
        run: cargo install cargo-llvm-cov --locked

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pnpm through corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm --dir jscpd store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('jscpd/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache upstream jscpd install and build
        uses: actions/cache@v4
        with:
          path: |
            jscpd/node_modules
            jscpd/apps/**/dist
            jscpd/packages/**/dist
          key: ${{ runner.os }}-jscpd-upstream-${{ hashFiles('jscpd/pnpm-lock.yaml', 'jscpd/apps/**', 'jscpd/packages/**') }}
          restore-keys: |
            ${{ runner.os }}-jscpd-upstream-

      - name: Release gate
        run: |
          if [[ "$RELEASE_CANDIDATE" == "1" ]]; then
            FULL=1 PUBLIC=1 PUBLIC_RUNS="$PUBLIC_RUNS" scripts/release-candidate.sh
          else
            NPM_PACKAGE_CHECK_REUSE_TARGET=1 scripts/release-gate.sh
          fi
