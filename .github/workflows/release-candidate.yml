name: release-candidate

on:
  workflow_call:
    inputs:
      public_runs:
        required: false
        default: "3"
        type: string
  workflow_dispatch:
    inputs:
      public_runs:
        description: "Number of public benchmark timing runs"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

env:
  CI: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_LLVM_COV_VERSION: "0.8.7"

jobs:
  core:
    name: core release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup component add clippy --toolchain 1.93.0
          rustup component add rustfmt --toolchain 1.93.0
          rustup default 1.93.0

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.93.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.93.0-

      - name: Cache cargo-llvm-cov binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Install cargo-llvm-cov
        run: |
          if ! command -v cargo-llvm-cov >/dev/null; then
            cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
          fi

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Enable pnpm through corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm --dir jscpd store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('jscpd/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache upstream jscpd install and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            jscpd/node_modules
            jscpd/apps/**/dist
            jscpd/packages/**/dist
          key: ${{ runner.os }}-jscpd-upstream-${{ hashFiles('jscpd/pnpm-lock.yaml', 'jscpd/apps/**', 'jscpd/packages/**') }}
          restore-keys: |
            ${{ runner.os }}-jscpd-upstream-

      - name: Core release gate
        run: FULL=0 PUBLIC=0 SUPPLY_CHAIN=1 scripts/release-candidate.sh

  compat-matrix:
    name: compat matrix shard ${{ matrix.shard }}
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-compat-${{ matrix.shard }}-cargo-1.93.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-compat-${{ matrix.shard }}-cargo-1.93.0-
            ${{ runner.os }}-cargo-1.93.0-

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Enable pnpm through corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm --dir jscpd store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('jscpd/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache upstream jscpd install and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            jscpd/node_modules
            jscpd/apps/**/dist
            jscpd/packages/**/dist
          key: ${{ runner.os }}-jscpd-upstream-${{ hashFiles('jscpd/pnpm-lock.yaml', 'jscpd/apps/**', 'jscpd/packages/**') }}
          restore-keys: |
            ${{ runner.os }}-jscpd-upstream-

      - name: Run compatibility matrix shard
        env:
          COMPAT_SHARD_INDEX: ${{ matrix.shard }}
          COMPAT_SHARD_TOTAL: "4"
          STRICT: coverage
        run: scripts/compat-matrix.sh

  public-benchmark:
    name: public benchmark ${{ matrix.case }}
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [react, next, prometheus]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ matrix.case }}-cargo-1.93.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-${{ matrix.case }}-cargo-1.93.0-
            ${{ runner.os }}-cargo-1.93.0-

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Enable pnpm through corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm --dir jscpd store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('jscpd/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache upstream jscpd install and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            jscpd/node_modules
            jscpd/apps/**/dist
            jscpd/packages/**/dist
          key: ${{ runner.os }}-jscpd-upstream-${{ hashFiles('jscpd/pnpm-lock.yaml', 'jscpd/apps/**', 'jscpd/packages/**') }}
          restore-keys: |
            ${{ runner.os }}-jscpd-upstream-

      - name: Run public benchmark case
        env:
          CASES: ${{ matrix.case }}
          RUNS: ${{ inputs.public_runs }}
          CHECK_COMPAT: "1"
          MIN_SPEEDUP: "45"
        run: scripts/public-bench-suite.sh
